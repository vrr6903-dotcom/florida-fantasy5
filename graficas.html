<div style='text-align:center; font-size:1.1rem; font-weight:bold; color:#1e293b; padding:1rem; margin-top:2rem; border-top:1px solid #e2e8f0;'>
  ⚖️ Estadísticas como apoyo, tú decides tus números.<br>
  <span style='font-size:0.9rem; font-weight:normal; color:#475569;'>Información sin validez oficial. Consulta siempre los resultados en la página oficial de la Lotería de Florida.</span>

<script>
(function () {
  var CLAVE_FECHA = 'monetagIPPFecha';
  var CLAVE_CONTEO = 'monetagIPPConteo';
  var MAX_POR_DIA = 2;
  var hoy = new Date().toISOString().slice(0, 10);
  try {
    var fechaGuardada = localStorage.getItem(CLAVE_FECHA);
    var conteo = parseInt(localStorage.getItem(CLAVE_CONTEO) || '0', 10);
    if (fechaGuardada !== hoy) {
      conteo = 0;
      localStorage.setItem(CLAVE_FECHA, hoy);
    }
    if (conteo >= MAX_POR_DIA) return; // ya alcanzó el máximo del día, no se carga el anuncio
    localStorage.setItem(CLAVE_CONTEO, String(conteo + 1));
  } catch (e) {
    // Si el navegador bloquea localStorage (modo privado, etc.), se muestra
    // el anuncio de todos modos, sin límite, en vez de fallar la página.
  }
  (function(s){s.dataset.zone='11749394',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
})();
</script>
<script>
var historialCacheJSON = null;
async function cargarHistorialJSON() {
  if (historialCacheJSON) return historialCacheJSON;
  try {
    const resp = await fetch('historial.json');
    historialCacheJSON = await resp.json();
  } catch (e) {
    historialCacheJSON = [];
    console.error('No se pudo cargar historial.json', e);
  }
  return historialCacheJSON;
}

function colorPorAtrasoTab(valor) {
  if (valor <= 10) return { base: '#22c55e', top: '#4ade80', lado: '#16a34a' };
  if (valor <= 20) return { base: '#f59e0b', top: '#fbbf24', lado: '#b45309' };
  return { base: '#ef4444', top: '#f87171', lado: '#b91c1c' };
}

function dibujarGraficaAtraso(titulo, etiquetas, valores, idContenedor) {
  const contenido = document.getElementById(idContenedor);
  const maxDato = Math.max.apply(null, valores.concat([0]));
  let ejeMax = 100, paso = 20;
  if (maxDato > ejeMax) {
    paso = maxDato <= 200 ? 25 : maxDato <= 500 ? 50 : 100;
    ejeMax = Math.ceil(maxDato / paso) * paso;
  }
  const n = valores.length;
  const altoSvg = 320, margenIzq = 46, margenDer = 24, margenInferior = 50, margenSuperior = 24;
  const altoDisponible = altoSvg - margenInferior - margenSuperior;
  const profundidad = 10, anchoBarra = 60, separacion = 60, espacio = anchoBarra + separacion;
  const anchoSvg = margenIzq + 30 + (n - 1) * espacio + anchoBarra + profundidad + margenDer + 20;
  let ejeSvg = '';
  const numLineas = ejeMax / paso;
  for (let i = 0; i <= numLineas; i++) {
    const valorLinea = i * paso;
    const y = margenSuperior + altoDisponible - (valorLinea / ejeMax) * altoDisponible;
    ejeSvg += '<line x1="' + margenIzq + '" y1="' + y + '" x2="' + (anchoSvg - margenDer) + '" y2="' + y + '" class="eje-linea-tab"></line>';
    ejeSvg += '<text x="' + (margenIzq - 10) + '" y="' + (y + 4) + '" text-anchor="end" class="eje-texto-tab">' + valorLinea + '</text>';
  }
  ejeSvg += '<line x1="' + margenIzq + '" y1="' + margenSuperior + '" x2="' + margenIzq + '" y2="' + (margenSuperior + altoDisponible) + '" class="eje-linea-tab"></line>';
  let barrasSvg = '';
  for (let i = 0; i < n; i++) {
    const valor = valores[i];
    const alturaBarra = ejeMax > 0 ? (valor / ejeMax) * altoDisponible : 0;
    const x = margenIzq + 30 + i * espacio;
    const y = margenSuperior + (altoDisponible - alturaBarra);
    const c = colorPorAtrasoTab(valor);
    const centroX = x + anchoBarra / 2 + profundidad / 2;
    barrasSvg += '<rect x="' + x + '" y="' + y + '" width="' + anchoBarra + '" height="' + alturaBarra + '" fill="' + c.base + '"></rect>';
    barrasSvg += '<polygon points="' + (x+anchoBarra) + ',' + y + ' ' + (x+anchoBarra+profundidad) + ',' + (y-profundidad) + ' ' + (x+anchoBarra+profundidad) + ',' + (y-profundidad+alturaBarra) + ' ' + (x+anchoBarra) + ',' + (y+alturaBarra) + '" fill="' + c.lado + '"></polygon>';
    barrasSvg += '<polygon points="' + x + ',' + y + ' ' + (x+profundidad) + ',' + (y-profundidad) + ' ' + (x+anchoBarra+profundidad) + ',' + (y-profundidad) + ' ' + (x+anchoBarra) + ',' + y + '" fill="' + c.top + '"></polygon>';
    barrasSvg += '<text x="' + centroX + '" y="' + (y-profundidad-8) + '" text-anchor="middle" class="barra-valor-tab">' + valor + '</text>';
    barrasSvg += '<text x="' + (x+anchoBarra/2) + '" y="' + (altoSvg-margenInferior+22) + '" text-anchor="middle" class="barra-etiqueta-tab">' + etiquetas[i] + '</text>';
  }
  contenido.innerHTML =
    '<style>.eje-linea-tab{stroke:#e2e8f0;stroke-width:1}.eje-texto-tab{font-size:11px;fill:#94a3b8}.barra-valor-tab{font-weight:700;font-size:14px;fill:#1e293b}.barra-etiqueta-tab{font-size:13px;fill:#475569}</style>' +
    '<div style="font-size:1.1rem; font-weight:700; margin-bottom:12px;">📈 ' + titulo + '</div>' +
    '<svg viewBox="0 0 ' + anchoSvg + ' ' + altoSvg + '" style="width:100%; max-width:460px; height:auto;">' + ejeSvg + barrasSvg + '</svg>' +
    '<div class="leyenda" style="margin-top:10px;">' +
      '<span><i style="background:#22c55e; width:12px; height:12px; border-radius:3px; display:inline-block;"></i> Atraso bajo (≤10)</span> ' +
      '<span><i style="background:#f59e0b; width:12px; height:12px; border-radius:3px; display:inline-block;"></i> Atraso medio (11-20)</span> ' +
      '<span><i style="background:#ef4444; width:12px; height:12px; border-radius:3px; display:inline-block;"></i> Atraso alto (&gt;20)</span>' +
    '</div>';
}

async function buscarGraficaAtraso() {
  const valor = document.getElementById('inputGraficaNumeros').value;
  const numeros = valor.split(/[\s,]+/).map(function(n){ return parseInt(n,10); }).filter(function(n){ return !isNaN(n); });
  const resumen = document.getElementById('resumenGraficaAtraso');
  const contenedor = document.getElementById('contenidoGraficaAtraso');
  contenedor.innerHTML = '';
  if (numeros.length === 0) {
    resumen.innerHTML = 'Escribe al menos un número.';
    return;
  }
  if (numeros.length > 3) {
    resumen.innerHTML = '⚠️ Máximo 3 números: un número, un par o una tercia.';
    return;
  }
  resumen.innerHTML = 'Calculando...';
  const historial = await cargarHistorialJSON();
  if (!historial || historial.length === 0) {
    resumen.innerHTML = 'No se pudo cargar el historial.';
    return;
  }
  const ultimoConcurso = historial[historial.length - 1].concurso;
  const valores = numeros.map(function(num){
    let ultimoDelNumero = 0;
    for (let i = historial.length - 1; i >= 0; i--) {
      if (historial[i].numeros.indexOf(num) !== -1) { ultimoDelNumero = historial[i].concurso; break; }
    }
    return ultimoDelNumero > 0 ? (ultimoConcurso - ultimoDelNumero) : ultimoConcurso;
  });
  const etiquetas = numeros.map(function(n){ return 'N° ' + n; });
  const tipo = numeros.length === 1 ? 'Número' : numeros.length === 2 ? 'Par' : 'Tercia';
  resumen.innerHTML = tipo + ' ' + numeros.join('-') + ': atraso actual por número';
  dibujarGraficaAtraso('Distancia por Número', etiquetas, valores, 'contenidoGraficaAtraso');
}

function limpiarGraficaAtraso() {
  document.getElementById('inputGraficaNumeros').value = '';
  document.getElementById('resumenGraficaAtraso').innerHTML = '';
  document.getElementById('contenidoGraficaAtraso').innerHTML = '';
}
</script>
